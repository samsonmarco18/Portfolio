services:
  - type: web
    name: marco-samson-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marco-samson-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: marco-samson-db
    plan: free
    databaseName: portfolio
    user: portfolio
    ipAllowList: []
