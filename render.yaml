services:
  - type: web
    name: marco-samson-portfolio
    runtime: node
    plan: free
    rootDir: portfolio
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.1
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: portfolio-private
      - key: ADMIN_PASSWORD
        sync: false
